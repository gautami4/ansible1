- name: print the ansible facts and install nginx if RHEL
  hosts: web
  tasks:
  - name: print the facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts }}"
  - name: install nginx if RHEL
    ansible.builtin.dnf:
      name : nginx
      state: installed
    when: ansible_os_family == "RedHat"
  - name: install nginx if ubuntu
    ansible.builtin.apt:
      name : nginx
      state: installed
    when: ansible_os_family == "debian"
    
